<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' file: data:; object-src 'none'; connect-src 'none'; frame-src 'none'">
  <title>AE Browse</title>
  <link rel="stylesheet" href="ui/panel.css">
</head>
<body>
  <header class="topbar">
    <div><strong>AE Browse</strong><span class="edition">素材浏览器</span></div>
    <div class="host-tools"><button id="read-instance" type="button" disabled>读取所选实例</button><button id="refresh-host" class="quiet" type="button">刷新合成</button></div>
  </header>
  <div class="library-tools">
    <label class="sr-only" for="library">选择图形库</label>
    <select id="library"><option value="">尚未添加图形库</option></select>
    <button id="refresh-library" class="quiet icon-button" type="button" title="刷新当前文件夹" aria-label="刷新当前文件夹">↻</button>
    <details id="source-management" class="source-management">
      <summary title="管理素材来源">来源管理</summary>
      <div class="source-menu">
        <button id="add-folder" type="button">添加素材文件夹…</button>
        <button id="enter-path" type="button">输入文件夹路径…</button>
        <button id="add-library" type="button" title="包含参数和动画的图形模板">添加参数图形包…</button>
        <hr>
        <button id="remove-library" type="button" title="只移除登记，不删除文件">移除当前来源</button>
      </div>
    </details>
  </div>
  <p id="library-location" class="library-location" title=""></p>
  <section id="setup" class="setup" hidden aria-label="首次配置素材路径">
    <div class="setup-icon" aria-hidden="true"><svg width="42" height="34" viewBox="0 0 42 34" fill="none"><path d="M3 29V5h13l4 5h19v19H3Z" stroke="currentColor" stroke-width="1.5"/><path d="M3 12h36" stroke="currentColor" stroke-width="1.5"/></svg></div>
    <h1>设置素材文件夹</h1>
    <p>选择存放 SVG、PNG、JPG 的文件夹。<br>包含子文件夹，下次打开会恢复此来源。</p>
    <div class="setup-actions"><button id="setup-browse" type="button">选择文件夹…</button><button id="setup-path" class="quiet" type="button">输入路径…</button></div>
    <p class="setup-hint">也可将文件夹或素材文件拖入面板。</p>
    <button id="setup-pack" class="text-button" type="button">添加参数图形包…</button>
  </section>
  <div id="path-entry" hidden>
    <label id="path-label" for="library-path">素材文件夹（SVG / PNG / JPG）</label>
    <div class="path-controls"><input id="library-path" type="text" placeholder="D:\图形库"><button id="register-path" type="button">载入</button><button id="cancel-path" class="quiet" type="button">取消</button></div>
  </div>
  <div class="search-tools">
    <label class="sr-only" for="folder-nav">子文件夹</label><select id="folder-nav" title="筛选子文件夹" hidden><option value="">全部文件夹</option></select>
    <input id="search" type="search" aria-label="搜索名称或标签" placeholder="搜索名称或标签…">
    <span id="asset-count">0 项</span>
  </div>
  <main>
    <section class="catalog" aria-label="素材列表">
      <div id="grid" class="grid"></div>
      <p id="empty" class="empty">文件夹中暂无可用素材。</p>
    </section>
    <div id="pane-divider" class="pane-divider" role="separator" tabindex="0" aria-label="调整素材列表与详情大小" aria-orientation="vertical" aria-valuemin="25" aria-valuemax="75" aria-valuenow="52" title="拖动调整大小；双击恢复；方向键微调"></div>
    <aside class="details" aria-label="素材详情">
      <div id="detail-empty" class="empty">选择素材，查看参数与使用提示。</div>
      <div id="detail" hidden>
        <div class="detail-heading"><h1 id="asset-name"></h1><span class="kind">原生形状</span></div>
        <div class="preview-stage"><div id="card-preview" class="card-preview"></div></div>
        <p class="preview-note">面板近似预览 · 颜色与效果以 AE 为准</p>
        <p id="asset-help" class="help"></p>
        <form id="parameters" autocomplete="off"></form>
        <div id="svg-options" hidden><div class="parameter"><label for="svg-mode">导入方式</label><select id="svg-mode"><option value="shape">可编辑形状图层</option><option value="image">透明图片</option></select></div><p id="svg-help" class="parameter-help">路径、纯色填充与描边转换为 AE 形状。</p></div>
        <ul id="asset-diagnostics" class="diagnostics"></ul>
        <p id="instance-info" class="instance-info" hidden></p>
        <button id="update-instance" class="primary" type="button" hidden disabled>更新所选图形</button>
        <p id="update-help" class="parameter-help" hidden>仅更新外观，保留原动画。修改后点击应用；更换所选图层后请重新读取。</p>
        <button id="instantiate" class="primary" type="button" disabled>添加到当前合成</button>
        <p id="result" class="result" aria-live="polite"></p>
      </div>
    </aside>
  </main>
  <footer><span id="context">正在连接 AE…</span><span id="runtime"></span></footer>
  <div id="status" role="status" aria-live="polite">正在初始化…</div>
  <div id="drop-overlay" class="drop-overlay" hidden aria-hidden="true"><strong>松开以添加素材</strong><span>支持文件夹或多个 SVG / PNG / JPG 文件</span><span>加入素材列表，随后可添加到合成</span></div>
  <script src="vendor/CSInterface.js"></script>
  <script src="bridge/host-bridge.js"></script>
  <script src="ui/demo-data.js"></script>
  <script src="ui/shape-preview.js"></script>
  <script src="ui/instance-editor.js"></script>
  <script src="ui/panel-layout.js"></script>
  <script src="ui/svg-raster.js"></script>
  <script src="ui/svg-shapes.js"></script>
  <script src="ui/file-drop.js"></script>
  <script src="ui/panel.js"></script>
</body>
</html>
